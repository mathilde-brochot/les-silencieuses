<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les Silencieuses — Mathilde Brochot, Artiste Contemporaine</title>
<meta name="description" content="Les Silencieuses, la nouvelle série de Mathilde Brochot. Seulement 4 toiles disponibles, dimanche 6 décembre 2026 à 20h.">
<meta property="og:title" content="Les Silencieuses — Mathilde Brochot">
<meta property="og:description" content="Seulement 4 toiles disponibles. Rendez-vous dimanche 6 décembre 2026 à 20h.">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@200;300;400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --nuit: #050a12;
    --bleu-nuit: #0a2740;
    --turquoise: #1f86a8;
    --bleu-clair: #7ec3e0;
    --bleu-pale: #a9d8ee;
    --or: #d49a4a;
    --ocre: #a8692a;
    --blanc: #f6f8f9;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    color: var(--blanc);
    background: var(--nuit);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ---------- FOND ---------- */
  .fond {
    position: fixed; inset: 0; z-index: 0; overflow: hidden;
    background:
      radial-gradient(ellipse 60% 45% at 10% 10%, #02060c 0%, transparent 70%),
      radial-gradient(ellipse 50% 40% at 90% 8%, #03080f 0%, transparent 70%),
      var(--nuit);
  }
  .tache {
    position: absolute; border-radius: 50%; filter: blur(70px);
    animation: derive 28s ease-in-out infinite alternate;
  }
  .t1 { width: 42vw; height: 30vw; left: 30%; top: 4%;  background: var(--turquoise);  opacity: .75; }
  .t2 { width: 30vw; height: 40vw; left: 4%;  top: 28%; background: var(--bleu-clair); opacity: .55; animation-duration: 34s; }
  .t3 { width: 30vw; height: 26vw; left: 56%; top: 38%; background: var(--bleu-pale);  opacity: .40; animation-duration: 31s; animation-direction: alternate-reverse; }
  .t4 { width: 34vw; height: 34vw; left: 38%; top: 58%; background: var(--bleu-nuit);  opacity: .90; animation-duration: 38s; }
  .t5 { width: 20vw; height: 18vw; left: 58%; top: 70%; background: var(--or);         opacity: .60; animation-duration: 36s; animation-direction: alternate-reverse; }
  .t6 { width: 18vw; height: 16vw; left: 10%; top: 72%; background: var(--ocre);       opacity: .55; animation-duration: 30s; }
  @keyframes derive {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(4vw, -3vw) scale(1.12); }
  }
  .voile {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, rgba(5,10,18,.20) 0%, rgba(5,10,18,.70) 100%);
  }

  /* ---------- PAGE ---------- */
  .page {
    position: relative; z-index: 1;
    min-height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(1.6rem, 4.5vh, 2.8rem);
    padding: clamp(2rem, 6vh, 4rem) 1.25rem;
    padding-top: max(clamp(2rem, 6vh, 4rem), env(safe-area-inset-top, 0px));
    padding-bottom: max(clamp(2rem, 6vh, 4rem), env(safe-area-inset-bottom, 0px));
    text-align: center;
  }

  .signature .nom {
    font-weight: 300; font-size: clamp(1.05rem, 2.6vw, 1.35rem);
    letter-spacing: .14em;
  }
  .signature .metier {
    margin-top: .35rem; font-weight: 300; font-size: clamp(.85rem, 2vw, 1rem);
    letter-spacing: .08em; color: rgba(246,248,249,.72);
  }

  /* ---------- TITRE + TROIS TRAITS ---------- */
  .titre { padding: clamp(1.6rem, 5vw, 3rem) 0; }
  .titre h1 {
    font-weight: 400;
    font-size: clamp(1.05rem, 5.4vw, 3.4rem);
    letter-spacing: .22em;
    padding-left: .22em;
    white-space: nowrap;
  }
  .lettre-i { position: relative; display: inline-block; }
  .traits { position: absolute; left: 50%; top: 0; width: 0; height: 0; pointer-events: none; }
  .traits i {
    position: absolute; display: block; width: 1px;
    background: linear-gradient(to bottom, rgba(246,248,249,0), var(--blanc) 18%, var(--blanc) 78%, rgba(246,248,249,0));
  }
  .traits i:nth-child(1) { left: -.14em; top: -.62em; height: 2.30em; }
  .traits i:nth-child(2) { left:  .02em; top: -.20em; height: 1.75em; }
  .traits i:nth-child(3) { left:  .20em; top: -.90em; height: 1.20em; }

  .rarete {
    font-weight: 300; font-size: clamp(1rem, 2.4vw, 1.2rem);
    letter-spacing: .04em;
  }
  .rarete strong { font-weight: 500; color: var(--or); }

  /* ---------- COMPTE À REBOURS ---------- */
  .compte { display: flex; flex-direction: column; align-items: center; gap: 1rem; }
  .unites { display: flex; gap: clamp(.5rem, 2vw, 1.1rem); }
  .unite {
    min-width: clamp(4.2rem, 17vw, 7rem);
    padding: clamp(.8rem, 2.2vw, 1.3rem) .5rem clamp(.65rem, 1.8vw, 1rem);
    background: rgba(5,10,18,.40);
    border: 1px solid rgba(246,248,249,.22);
    border-radius: 4px;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  .chiffre {
    display: block;
    font-weight: 200; font-size: clamp(2rem, 8.5vw, 4rem);
    line-height: 1; font-variant-numeric: tabular-nums;
  }
  .legende {
    display: block; margin-top: .5rem;
    font-weight: 300; font-size: clamp(.72rem, 1.9vw, .88rem);
    color: rgba(246,248,249,.72); letter-spacing: .06em;
  }
  .date-lancement {
    font-weight: 300; font-size: clamp(.9rem, 2.2vw, 1.05rem);
    color: rgba(246,248,249,.85); letter-spacing: .05em;
  }
  .ouvert { display: none; font-weight: 300; font-size: clamp(1.3rem, 4vw, 2rem); letter-spacing: .06em; }
  .fini .unites, .fini .date-lancement { display: none; }
  .fini .ouvert { display: block; }

  /* ---------- BOUTONS ---------- */
  .actions { display: flex; flex-direction: column; gap: .8rem; width: min(100%, 30rem); }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: .7rem;
    padding: .95rem 1.4rem; border-radius: 4px;
    font-family: inherit; font-size: clamp(.9rem, 2.3vw, 1rem); font-weight: 400;
    line-height: 1.4; text-decoration: none; letter-spacing: .02em;
    transition: background .25s, color .25s, border-color .25s;
  }
  .btn-principal { background: var(--blanc); color: var(--nuit); font-weight: 500; }
  .btn-principal:hover { background: var(--or); }
  .btn-secondaire {
    color: var(--blanc); border: 1px solid rgba(246,248,249,.55);
    background: rgba(5,10,18,.30);
  }
  .btn-secondaire:hover { border-color: var(--blanc); background: rgba(246,248,249,.12); }
  .btn svg { width: 1.3rem; height: 1.3rem; flex: none; }
  .btn:focus-visible { outline: 2px solid var(--or); outline-offset: 3px; }

  @media (max-width: 420px) {
    .titre h1 { letter-spacing: .16em; padding-left: .16em; }
  }
  @media (prefers-reduced-motion: reduce) {
    .tache { animation: none; }
    .btn { transition: none; }
  }
</style>
</head>
<body>

<div class="fond" aria-hidden="true">
  <div class="tache t1"></div>
  <div class="tache t2"></div>
  <div class="tache t3"></div>
  <div class="tache t4"></div>
  <div class="tache t5"></div>
  <div class="tache t6"></div>
  <div class="voile"></div>
</div>

<main class="page">

  <header class="signature">
    <p class="nom">Mathilde Brochot</p>
    <p class="metier">Artiste Contemporaine</p>
  </header>

  <div class="titre">
    <h1 aria-label="Les Silencieuses">LES SILENC<span class="lettre-i">I<span class="traits" aria-hidden="true"><i></i><i></i><i></i></span></span>EUSES</h1>
  </div>

  <p class="rarete">Seulement <strong>4 toiles</strong> disponibles</p>

  <section class="compte" id="compte" aria-label="Compte à rebours avant l'ouverture">
    <div class="unites" role="timer">
      <div class="unite"><span class="chiffre" id="jours">00</span><span class="legende">jours</span></div>
      <div class="unite"><span class="chiffre" id="heures">00</span><span class="legende">heures</span></div>
      <div class="unite"><span class="chiffre" id="minutes">00</span><span class="legende">minutes</span></div>
      <div class="unite"><span class="chiffre" id="secondes">00</span><span class="legende">secondes</span></div>
    </div>
    <p class="date-lancement">Dimanche 6 décembre 2026 à 20h</p>
    <p class="ouvert">Les silencieuses sont là.</p>
  </section>

  <nav class="actions" aria-label="Liens">
    <a class="btn btn-principal" id="lien-newsletter" href="#">
      Accès 2h avant tout le monde en m'inscrivant à la newsletter
    </a>
    <a class="btn btn-secondaire" id="lien-instagram" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="5"></rect>
        <circle cx="12" cy="12" r="4.2"></circle>
        <circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none"></circle>
      </svg>
      Suivre les coulisses sur Instagram
    </a>
  </nav>

</main>

<script>
  /* ====== À MODIFIER ICI ====== */
  var LIEN_NEWSLETTER = "https://d75eed64.sibforms.com/serve/MUIFAIPZnHxeBaOZhQuxConNEQJtpbkkGg8aN7vKzqfTYpy5m4VJXgSNTT0tW2ftvRvFE1MqxnMcOAaf2RkZhLQ_kNTkXF59FKaQDVJSZclkODKWPXlzkflpEPTziYh_drjR2d6iuwJhCehmrNuvLZLnoTtcFCEoJ1IJdBHUVXqd-teJWxiUnyGGNs_KkQABK5-RDX6LbhsuvRwI";
  var LIEN_INSTAGRAM  = "https://www.instagram.com/mathilde.brochot.artiste/";
  var LIEN_BOUTIQUE   = "https://mathilde-artistepeintre.sumupstore.com/";
  // Dimanche 6 décembre 2026, 20h (heure de Paris en hiver = UTC+1)
  var DATE_LANCEMENT  = new Date("2026-12-06T20:00:00+01:00");
  /* ============================ */

  document.getElementById("lien-newsletter").href = LIEN_NEWSLETTER;
  document.getElementById("lien-instagram").href = LIEN_INSTAGRAM;

  var compte = document.getElementById("compte");
  var el = {
    j: document.getElementById("jours"),
    h: document.getElementById("heures"),
    m: document.getElementById("minutes"),
    s: document.getElementById("secondes")
  };
  function deux(n) { return n < 10 ? "0" + n : "" + n; }

  function tic() {
    var reste = DATE_LANCEMENT.getTime() - Date.now();
    if (reste <= 0) {
      compte.classList.add("fini");
      var bouton = document.getElementById("lien-newsletter");
      bouton.textContent = "Découvrir Les Silencieuses";
      bouton.href = LIEN_BOUTIQUE;
      clearInterval(minuteur);
      return;
    }
    var total = Math.floor(reste / 1000);
    el.j.textContent = deux(Math.floor(total / 86400));
    el.h.textContent = deux(Math.floor((total % 86400) / 3600));
    el.m.textContent = deux(Math.floor((total % 3600) / 60));
    el.s.textContent = deux(total % 60);
  }
  var minuteur = setInterval(tic, 1000);
  tic();
</script>
</body>
</html>
